<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Grupo y Salón - CELEX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container-box {
            max-width: 500px;
            margin: 50px auto;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header-bg {
            background: linear-gradient(135deg, #800020 0%, #5a0017 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
        }
        .btn-ipn {
            background-color: #800020;
            color: white;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
        }
        .btn-ipn:hover {
            background-color: #600018;
            color: white;
        }
        .info-label {
            font-size: 0.85rem;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 700;
        }
        .info-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: #212529;
        }
    </style>
</head>
<body>

<div class="container container-box px-3">
    <div class="card card-custom">
        <div class="header-bg">
            <h3 class="mb-1 font-weight-bold">CELEX CECyT 3</h3>
            <p class="mb-0 opacity-75">Consulta de Grupo y Salón</p>
            <span class="badge bg-light text-dark mt-2">Periodo: {{ periodo }}</span>
        </div>
        
        <div class="card-body p-4">
            <form onsubmit="event.preventDefault(); buscarAlumno();">
                <div class="mb-3">
                    <label for="boletaInput" class="form-label font-weight-bold">Ingresa tu Boleta / Matrícula:</label>
                    <input type="text" id="boletaInput" class="form-control form-control-lg text-center" placeholder="Ej. 2025010090" autocomplete="off" autofocus>
                </div>
                <button type="submit" class="btn btn-ipn w-100 btn-lg shadow-sm">Buscar Mi Grupo</button>
            </form>

            <div id="loading" class="text-center mt-4 d-none">
                <div class="spinner-border text-danger" role="status"></div>
                <p class="mt-2 text-muted">Buscando asignación...</p>
            </div>

            <div id="resultadoContainer" class="mt-4"></div>
        </div>
    </div>
</div>

<script>
async function buscarAlumno() {
    const q = document.getElementById("boletaInput").value.trim();
    const container = document.getElementById("resultadoContainer");
    const loading = document.getElementById("loading");

    if (q.length < 3) {
        container.innerHTML = `<div class="alert alert-warning text-center">Ingresa al menos 3 dígitos de tu boleta.</div>`;
        return;
    }

    loading.classList.remove("d-none");
    container.innerHTML = "";

    try {
        const res = await fetch(`/api/consulta_alumno?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        loading.classList.add("d-none");

        if (data.resultados && data.resultados.length > 0) {
            let html = "";
            data.resultados.forEach(item => {
                html += `
                <div class="card border border-2 border-danger rounded-3 mb-3">
                    <div class="card-body p-3">
                        <div class="text-center border-bottom pb-2 mb-3">
                            <span class="info-label">Boleta Verificada</span>
                            <div class="h4 text-danger mb-0">${item.boleta}</div>
                        </div>
                        <div class="row text-center">
                            <div class="col-4 border-end">
                                <span class="info-label">Grupo</span>
                                <div class="info-value text-primary">${item.grupo}</div>
                            </div>
                            <div class="col-4 border-end">
                                <span class="info-label">Turno</span>
                                <div class="info-value">${item.turno}</div>
                            </div>
                            <div class="col-4">
                                <span class="info-label">Salón</span>
                                <div class="info-value text-success">${item.salon}</div>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        } else {
            container.innerHTML = `<div class="alert alert-danger text-center mb-0">No se encontró inscripción activa para esta boleta en el periodo.</div>`;
        }
    } catch (e) {
        loading.classList.add("d-none");
        container.innerHTML = `<div class="alert alert-danger text-center mb-0">Error de conexión al servidor. Intenta nuevamente.</div>`;
    }
}
</script>

</body>
</html>
