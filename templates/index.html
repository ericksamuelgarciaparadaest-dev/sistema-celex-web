<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CELEX - Control Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .navbar-custom { background-color: #800020; }
        .card-header-custom { background-color: #1B365D; color: white; font-weight: bold; }
        .badge-matricula { background-color: #800020; color: white; font-size: 0.9em; }
        .search-input { height: 48px; font-size: 1.1rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom mb-4 shadow">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🏫 Sistema CELEX - Control de Inscritos</span>
            <span class="badge bg-success fs-6">🟢 Conectado a Neon</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card shadow-sm mb-4">
            <div class="card-header card-header-custom">🔍 Verificación de Inscripción por Bimestre</div>
            <div class="card-body p-4">
                <div class="row g-3 align-items-center">
                    <div class="col-md-7">
                        <label class="form-label fw-bold">Buscar Alumno en PB2 (Nombre o Matrícula):</label>
                        <input type="text" id="inputBusqueda" class="form-control border-primary search-input" 
                               placeholder="Escribe un apellido, nombre o matrícula..." autofocus>
                    </div>
                    <div class="col-md-5">
                        <label class="form-label fw-bold">Verificar Estado en Bimestre / Tabla:</label>
                        <select id="selectTabla" class="form-select border-primary search-input fw-bold">
                            {% for t in tablas %}
                                <option value="{{ t }}" {% if t == '2026_04' %}selected{% endif %}>
                                    📊 Bimestre: {{ t }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <span id="tituloResultados">📋 Estado de Inscripción de Alumnos</span>
                <span id="totalRegistros" class="badge bg-light text-dark">0 registros</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark" id="encabezadoTabla"></thead>
                        <tbody id="cuerpoTabla">
                            <tr><td class="text-center text-muted p-4">Cargando información...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        var timerBusqueda = null;

        document.addEventListener("DOMContentLoaded", function() {
            var input = document.getElementById('inputBusqueda');
            var select = document.getElementById('selectTabla');

            input.oninput = function() {
                clearTimeout(timerBusqueda);
                timerBusqueda = setTimeout(realizarConsulta, 100);
            };

            select.onchange = function() {
                realizarConsulta();
            };

            realizarConsulta();
        });

        function realizarConsulta() {
            var q = document.getElementById('inputBusqueda').value.trim();
            var tabla = document.getElementById('selectTabla').value;
            var cuerpo = document.getElementById('cuerpoTabla');
            var encabezado = document.getElementById('encabezadoTabla');
            var total = document.getElementById('totalRegistros');
            var titulo = document.getElementById('tituloResultados');

            if (!tabla) return;

            titulo.textContent = '📋 Alumnos en PB2 vs Bimestre: ' + tabla.toUpperCase();

            var url = '/buscar?q=' + encodeURIComponent(q) + '&tabla=' + encodeURIComponent(tabla);

            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);

                    if (data.error) {
                        cuerpo.innerHTML = '<tr><td class="text-danger p-3">Error BD: ' + data.error + '</td></tr>';
                        return;
                    }

                    total.textContent = data.resultados.length + ' alumnos';

                    if (data.resultados.length === 0) {
                        cuerpo.innerHTML = '<tr><td class="text-center text-muted p-4">No se encontraron alumnos para "' + q + '".</td></tr>';
                        encabezado.innerHTML = '';
                        return;
                    }

                    // Renderizar Columnas
                    var thHtml = '<tr>';
                    for (var i = 0; i < data.columnas.length; i++) {
                        var colName = data.columnas[i];
                        if (colName === 'estado_inscripcion') {
                            thHtml += '<th class="table-warning text-dark text-center">ESTADO EN ' + tabla.toUpperCase() + '</th>';
                        } else {
                            thHtml += '<th class="text-uppercase">' + colName + '</th>';
                        }
                    }
                    thHtml += '</tr>';
                    encabezado.innerHTML = thHtml;

                    // Renderizar Filas
                    var tdHtml = '';
                    for (var j = 0; j < data.resultados.length; j++) {
                        tdHtml += '<tr>';
                        var row = data.resultados[j];
                        for (var k = 0; k < data.columnas.length; k++) {
                            var colName = data.columnas[k];
                            var val = row[colName] !== undefined ? row[colName] : '';
                            
                            if (colName === 'estado_inscripcion') {
                                if (val === 'INSCRITO') {
                                    tdHtml += '<td class="text-center"><span class="badge bg-success px-3 py-2">INSCRITO</span></td>';
                                } else {
                                    tdHtml += '<td class="text-center"><span class="badge bg-secondary px-3 py-2">NO INSCRITO</span></td>';
                                }
                            } else if (colName.toLowerCase().indexOf('matricula') !== -1) {
                                tdHtml += '<td><span class="badge badge-matricula">' + val + '</span></td>';
                            } else if (colName.toLowerCase().indexOf('nombre') !== -1) {
                                tdHtml += '<td><strong>' + val + '</strong></td>';
                            } else {
                                tdHtml += '<td>' + val + '</td>';
                            }
                        }
                        tdHtml += '</tr>';
                    }
                    cuerpo.innerHTML = tdHtml;
                } else {
                    cuerpo.innerHTML = '<tr><td class="text-danger p-3">Error al consultar API.</td></tr>';
                }
            };
            xhr.onerror = function() {
                cuerpo.innerHTML = '<tr><td class="text-danger p-3">Error de conexión.</td></tr>';
            };
            xhr.send();
        }
    </script>
</body>
</html>
